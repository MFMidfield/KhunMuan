<div class="h-full bg-primary-container" style="width: 60%;"></div>
</div>
<!-- Chosen Chips Row -->
<div class="flex gap-sm overflow-x-auto pb-xs scrollbar-hide">
<div class="flex items-center gap-xs bg-surface-container rounded-full px-3 py-1 border border-outline-variant shrink-0">

<button class="text-on-surface-variant hover:text-error transition-colors"><span class="material-symbols-outlined" style="font-size: 16px;">close</span></button>

</button>

<button class="w-8 h-8 flex items-center justify-center rounded-full text-primary hover:bg-primary-container/50 transition-colors">

</div>
<!-- Item 2: หมู -->

<span class="material-symbols-outlined">remove</span>

<button class="w-8 h-8 flex items-center justify-center rounded-full text-primary hover:bg-primary-container/50 transition-colors">
<span class="material-symbols-outlined">add</span>

</div>

<div class="bg-surface rounded-xl p-sm shadow-[0_1px_2px_rgba(16,23,32,0.04)] border border-transparent hover:border-outline-variant transition-colors flex flex-col group">

<span class="material-symbols-outlined">remove</span>

<div class="flex items-center justify-between bg-surface-container-low rounded-lg p-sm">
<div>
<p class="font-body-md text-body-md text-on-surface">น้ำจิ้มสุกี้</p>
<p class="font-mono-price text-mono-price text-on-surface-variant text-sm">+5฿</p>

<!-- Stepper -->
<div class="flex items-center gap-2 bg-primary-container/20 rounded-full px-1 py-1">
<button class="w-8 h-8 flex items-center justify-center rounded-full text-primary hover:bg-primary-container/50 transition-colors">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="font-mono-code text-mono-code text-on-surface font-semibold w-4 text-center">1</span>

<span class="material-symbols-outlined text-on-primary-container absolute opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" style="font-size: 16px; font-weight: bold;">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">รับช้อนส้อมพลาสติก</span>
</label>
</div>
<!-- Note Field -->
<div>
<h3 class="font-title-sm-mobile text-title-sm-mobile md:font-title-sm md:text-title-sm text-on-surface mb-sm">หมายเหตุถึงร้านค้า</h3>
<textarea class="w-full bg-surface border border-outline-variant rounded-xl p-sm font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/60 focus:border-outline focus:ring-0 transition-colors resize-none h-24" placeholder="เช่น ไม่ใส่ผักชี เผ็ดน้อย"></textarea>
</div>
</section>

<div class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline-variant p-container-padding pb-6 shadow-[0_-4px_16px_rgba(16,23,32,0.05)]">

<span class="font-mono-price text-display-lg text-on-surface">฿259</span>
</div>
<!-- Primary Button (Disabled State as requested: 6/10 items selected) -->
<button class="w-full bg-surface-container-highest text-on-surface-variant/50 font-body-lg text-body-lg font-semibold py-3 rounded-xl border border-outline-variant/30 flex justify-center items-center gap-2 cursor-not-allowed transition-all duration-200" disabled="">

        </button>
</div>
