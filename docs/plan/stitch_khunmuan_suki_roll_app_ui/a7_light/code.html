<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }

<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center">
<!-- Canvas Container -->
<main class="w-full max-w-[480px] bg-surface min-h-screen relative flex flex-col pb-24 shadow-[0_0_40px_rgba(16,23,32,0.05)] mx-auto overflow-hidden">
<!-- Top App Bar - Linear/Transactional flow (Custom based on TopAppBar component style) -->
<header class="w-full flex justify-between items-center px-container-padding h-16 bg-surface border-b border-outline-variant z-10 relative">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors duration-200 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">อัปโหลดสลิป</h1>
<div class="w-10 h-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Content Area -->
<div class="flex-1 flex flex-col px-container-padding py-xl gap-xl">
<!-- Payment Info Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg shadow-sm border border-surface-container-high flex flex-col items-center gap-md">
<div class="text-center w-full">
<p class="font-body-md text-body-md text-on-surface-variant mb-xs">ยอดชำระทั้งหมด</p>
<p class="font-mono-price text-[40px] leading-[48px] font-bold text-on-surface tracking-tight">฿259.00</p>
</div>
<div class="w-full border-t border-dashed border-outline-variant my-xs"></div>
<div class="w-48 h-48 bg-white p-2 rounded-lg border border-surface-container-high relative flex items-center justify-center">
<!-- QR Code Placeholder -->
<img class="w-full h-full object-cover rounded" data-alt="A clean, highly readable mock QR code for PromptPay payment in a modern minimalist style, set against a pure white background. The QR code should be sharp and clear, fitting the Modern Thai Minimalist aesthetic of the UI. Focus on stark contrast between the black QR elements and white background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAmuMu2IkRBT-tzwArTWOIv5Z0KtZSqwaGrciz2HZw4I3rgC_RvYPRAlTQMhyOE77A9t-FiB_wrPDjL8YjKJ6jOjG1YU_NbbcBw661p-8UaTYYR-HRuWqCMQHBdPqGG_CL5aTqRFU-zRbuF6FhAVGWAYO7csxU6vQd4FppMbBJNKmBZ97-oOjJSyGwMXN5Uh1tUDmY9mjOwM-s3ouT3lqeNaThwqXx4BiwP_r70-sTmLvetYdIMI6VC-g"/>
<!-- PromptPay Logo Overlay (simulated) -->
<div class="absolute bg-white rounded-full p-1 shadow-sm">
<span class="font-title-sm text-title-sm font-bold text-[#003366]">PromptPay</span>
</div>
</div>
<div class="w-full flex items-center justify-between mt-sm bg-surface-container-low rounded-lg p-sm">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant">พร้อมเพย์</span>
<span class="font-mono-code text-mono-code text-on-surface">098-765-4321</span>
</div>
<button class="text-primary hover:bg-primary-container/20 p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]" data-icon="content_copy">content_copy</span>
</button>
</div>
</div>
<!-- Upload Drop Zone -->
<div class="relative w-full h-40 border-2 border-dashed border-outline-variant hover:border-primary rounded-xl flex flex-col items-center justify-center bg-surface-container-lowest hover:bg-surface-container-low transition-colors duration-200 cursor-pointer overflow-hidden group">
<input accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" type="file"/>
<div class="flex flex-col items-center gap-sm transition-transform duration-200 group-hover:scale-105">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined text-[24px]" data-icon="upload_file">upload_file</span>
</div>
<p class="font-title-sm text-title-sm text-primary">แตะเพื่ออัปโหลดสลิป</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">รองรับไฟล์ JPG, PNG</p>
</div>
</div>
</div>
<!-- Sticky Bottom Action -->
<div class="fixed bottom-0 w-full max-w-[480px] bg-surface p-container-padding border-t border-surface-container-high shadow-[0_-4px_16px_rgba(0,0,0,0.02)] z-20">
<button class="w-full h-14 bg-primary-container text-on-surface font-title-sm text-title-sm font-bold rounded-xl border-[1.5px] border-on-surface shadow-[0_1px_2px_rgba(16,23,32,0.04)] hover:bg-[#ebd083] active:scale-[0.98] transition-all flex items-center justify-center gap-2 mb-sm">
<span class="material-symbols-outlined filled" data-icon="check_circle">check_circle</span>
                ส่งสลิป
            </button>
<p class="text-center font-label-sm text-label-sm text-on-surface-variant flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="info">info</span>
                แอดมินจะตรวจสลิปแล้วยืนยันให้
            </p>
</div>
</main>
<script>
        // Simple file input interaction simulation
        const fileInput = document.querySelector('input[type="file"]');
        const dropZoneText = document.querySelector('.group p.font-title-sm');
        const dropZoneIcon = document.querySelector('.group .material-symbols-outlined');

        fileInput.addEventListener('change', function(e) {
            if(this.files && this.files[0]) {
                const fileName = this.files[0].name;
                dropZoneText.textContent = fileName;
                dropZoneIcon.textContent = 'image';
                document.querySelector('.group').classList.add('border-primary', 'bg-surface-container-low');
            }
        });
    </script>
</body></html>
