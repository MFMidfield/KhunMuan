<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the page paint under the iPhone home indicator;
         the safe-area utilities in index.css keep controls clear of it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"
    />
    <title>คุณม้วน</title>
    <script>
      // Applied before first paint so a stored choice never flashes the wrong
      // theme. Light is the default and is stamped explicitly: leaving the root
      // unstamped would hand a dark-mode phone a dark first paint, which is the
      // behaviour this replaced.
      var t = 'light'
      try {
        if (localStorage.getItem('khunmuan.theme') === 'dark') t = 'dark'
      } catch (e) {
        /* private window, blocked storage: light, like everyone else */
      }
      document.documentElement.setAttribute('data-theme', t)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
